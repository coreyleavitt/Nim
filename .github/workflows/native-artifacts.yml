name: native-artifacts

# Builds the patched Nim toolchain prefix directly on native runners (no
# container) for platforms consumed as OCI artifacts rather than images:
#   ghcr.io/coreyleavitt/nim:<ver>-macos-arm64
#   ghcr.io/coreyleavitt/nim:<ver>-linux-arm64
#   ghcr.io/coreyleavitt/nim:<ver>-linux-x64
# Same recipe as the container images: release tarball + the committed
# backport series via build-nim.sh, validated against the repro suite.
# Consume with `oras pull` + extract; the prefix resolves its stdlib
# relative to bin/nim.
#
# Portability: the glibc artifacts (linux-x64, linux-arm64) are built on
# ubuntu-22.04 runners (glibc 2.35), never on a rolling distro, and
# scripts/check-glibc-floor.sh fails the job before any push if an ELF in the
# prefix needs a glibc symbol version above GLIBC_FLOOR. Raise the floor only
# together with the runner image. Hosts older than the floor need the
# linux-x64-musl artifact (published by linux-images.yml from alpine).

on:
  workflow_dispatch:
  push:
    branches: [toolchain]
    paths: ['.github/workflows/native-artifacts.yml', 'patches/**', 'build-nim.sh', 'tests/**', 'scripts/**', '.gitattributes']

permissions:
  contents: read
  packages: write

env:
  NIM_VER: "2.2.10"
  NIM_SHA: "7957b7ed004206bcf10bcc4f3b4744153878e62f2431552a9a8e9d3f40e8d5d5"
  # Highest glibc symbol version the linux artifacts may require. This is
  # ubuntu-22.04's glibc; the single place the floor is declared.
  GLIBC_FLOOR: "2.35"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            suffix: macos-arm64
          - runner: ubuntu-22.04
            suffix: linux-x64
          - runner: ubuntu-22.04-arm
            suffix: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build patched Nim from source
        run: |
          chmod +x build-nim.sh
          TARBALL_CACHE="$RUNNER_TEMP" \
          NIM_PATCH_DIR="$PWD/patches/$NIM_VER" \
          NIM_KOCH_TOOLS=1 \
            ./build-nim.sh "$NIM_VER" "$NIM_SHA" "$PWD/prefix/nim-$NIM_VER-patched"

      - name: Guard the glibc floor (before any push)
        if: runner.os == 'Linux'
        run: scripts/check-glibc-floor.sh "$PWD/prefix/nim-$NIM_VER-patched"

      - name: Validate against the series' repro suite
        run: |
          export PATH="$PWD/prefix/nim-$NIM_VER-patched/bin:$PATH"
          nim --version
          set -x
          nim c -r --hints:off --mm:orc --threads:on -d:release -o:"$RUNNER_TEMP/t1" tests/repro_allocshared.nim | grep -q survived
          nim c -r --hints:off --mm:orc --threads:on -d:release -o:"$RUNNER_TEMP/t2" tests/repro_ref_handoff.nim | grep -q survived
          nim c -r --hints:off --mm:orc -d:useMalloc -o:"$RUNNER_TEMP/t3" tests/repro_26025.nim | grep -q ok
          nim c -r --hints:off -o:"$RUNNER_TEMP/t4" tests/packed_case_vcc.nim | grep -q ok
          nim r --hints:off --nimcache:"$RUNNER_TEMP/nc_check" tests/check_packed_case_vcc.nim
          nim c -r --hints:off --mm:orc -o:"$RUNNER_TEMP/t5" tests/method_dispatch_table.nim | grep -q ok
          nim cpp -r --hints:off -o:"$RUNNER_TEMP/t6" tests/method_dispatch_table.nim | grep -q ok

      - name: Package prefix
        run: |
          tar -C prefix -cJf "nim-$NIM_VER-patched-${{ matrix.suffix }}.tar.xz" "nim-$NIM_VER-patched"
          { command -v sha256sum >/dev/null && sha256sum "nim-$NIM_VER-patched-${{ matrix.suffix }}.tar.xz"; } || shasum -a 256 "nim-$NIM_VER-patched-${{ matrix.suffix }}.tar.xz"

      - uses: oras-project/setup-oras@v1

      - name: Push OCI artifact to ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          patches=$(ls patches/$NIM_VER/*.patch | sed 's|.*/||' | paste -sd, -)
          oras push "ghcr.io/coreyleavitt/nim:$NIM_VER-${{ matrix.suffix }}" \
            --artifact-type application/x-nim-toolchain \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "dev.leavitt.nim.version=$NIM_VER" \
            --annotation "dev.leavitt.nim.patches=$patches" \
            "nim-$NIM_VER-patched-${{ matrix.suffix }}.tar.xz:application/x-xz"

      - uses: actions/upload-artifact@v4
        with:
          name: nim-${{ env.NIM_VER }}-patched-${{ matrix.suffix }}
          path: nim-${{ env.NIM_VER }}-patched-${{ matrix.suffix }}.tar.xz
          retention-days: 14
